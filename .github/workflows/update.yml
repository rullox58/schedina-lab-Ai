name: Aggiorna quote

on:
  schedule:
    # Orari in UTC. Ora solare italiana (UTC+1): 23:50 e 11:50.
    # Con l'ora legale (UTC+2, da fine marzo) cambia in "50 21" e "50 9".
    - cron: "50 22 * * *"
    - cron: "50 10 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica quote e calcola le probabilità
        run: python update.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Salva data.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna dati"
            git push
          fi
