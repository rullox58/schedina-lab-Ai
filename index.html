<header><h1>⚽ Schedina Lab</h1><div class="tabs"><button id="t1" class="on">📋 Partite</button><button id="t2">🧾 Schedina</button><button id="t3">✨ AI Agent</button></div></header>
<main id="app"></main>
<script>
const LG={CL:"Champions League",EU:"Europa League",CO:"Conference League",SA:"Serie A",SB:"Serie B",PL:"Premier League",CH:"Championship",E1:"League One",E2:"League Two",SC:"Scozia",L1:"Ligue 1",LL:"La Liga",PT:"Primeira Liga",ER:"Eredivisie",BL:"Bundesliga",B2:"2. Bundesliga",SW:"Allsvenskan",NO:"Eliteserien",DK:"Superliga danese",ATP:"ATP",WTA:"WTA",ITF:"ITF",CHL:"Challenger",NBA:"NBA",LBA:"Serie A basket"};
const SPN={c:"⚽ Calcio",t:"🎾 Tennis",b:"🏀 Basket"},SPL={c:["CL","EU","CO","SA","SB","PL","CH","E1","E2","SC","L1","LL","PT","ER","BL","B2","SW","NO","DK"],t:["ATP","WTA","ITF","CHL"],b:["NBA","LBA"]};
const spOf=lg=>Object.keys(SPL).find(s=>SPL[s].includes(lg));
const bp=m=>{const k=m.k.reduce((a,b)=>m.p[b]>m.p[a]?b:a);return{k,p:m.p[k]}};
const sel80=()=>{slip={};DATA.forEach(m=>{const b=bp(m);if(b.p*100>=thr)slip[m.id]=b.k});n=Math.max(1,Object.keys(slip).length)};
// AI Agent: molte schedine per livello di rischio; ognuna incrocia giocate ad alta probabilità (70%+) e media (50-70%), mai a bassa probabilità
const SPEC=[{r:"l",hi:2,md:0,o:0},{r:"l",hi:3,md:0,o:0},{r:"l",hi:3,md:0,o:3},{r:"l",hi:4,md:0,o:1},
{r:"m",hi:2,md:2,o:0},{r:"m",hi:3,md:2,o:1},{r:"m",hi:2,md:3,o:2},{r:"m",hi:4,md:3,o:3},
{r:"h",hi:4,md:4,o:0},{r:"h",hi:5,md:5,o:1},{r:"h",hi:6,md:6,o:0},{r:"h",hi:7,md:7,o:2}];
const RN={l:["Basso rischio","🟢","rl"],m:["Medio rischio","🟡","rm"],h:["Alto rischio","🟠","rh"]};
let played=[],openA={};try{played=JSON.parse(localStorage.getItem("pl")||"[]")}catch(e){}
const sv=()=>{try{localStorage.setItem("pl",JSON.stringify(played))}catch(e){}};
const tot=L=>{let Q=1,P=1;L.forEach(([id,k])=>{Q*=DATA[id].o[k];P*=DATA[id].p[k]});return{Q,P}};
function pools(){const A=[],B=[];DATA.forEach(m=>{let a=null,b=null;m.k.forEach(k=>{const p=m.p[k];if(p>=.7){if(!a||p>m.p[a])a=k}else if(p>=.5){if(!b||ed(m,k)+.3*p>ed(m,b)+.3*m.p[b])b=k}});const pen=low(m)?1:0;if(a)A.push([m.p[a]-pen,m.id,a]);if(b)B.push([m.p[b]+.5*ed(m,b)-pen,m.id,b])});A.sort((x,y)=>y[0]-x[0]);B.sort((x,y)=>y[0]-x[0]);return[A,B]}
function slips(){const[A,B]=pools();return SPEC.map(s=>{const used={},L=[];A.slice(s.o,s.o+s.hi).forEach(x=>{used[x[1]]=1;L.push([x[1],x[2]])});let c=0;for(let i=s.o;i<B.length&&c<s.md;i++){const x=B[i];if(!used[x[1]]){used[x[1]]=1;L.push([x[1],x[2]]);c++}}return{...s,L}}).filter(s=>s.L.length>=2&&s.L.length>=s.hi+s.md-1)}
function loadIt(i){const s=slips()[i];slip={};s.L.forEach(([id,k])=>slip[id]=k);n=Math.max(1,s.L.length);view=2}
function playIt(i){const s=slips()[i],{Q,P}=tot(s.L);played.unshift({d:new Date().toLocaleDateString("it-IT"),Q,pp:+(P*100).toFixed(1),l:s.L.map(([id,k])=>DATA[id].h+" – "+DATA[id].a+": "+lab(DATA[id],k)).join("; "),st:0});sv()}
function agentView(){let h=`<div class="card meta">Schedine generate dal modello statistico. Ogni selezione ha almeno il 50% di probabilità stimata e ogni schedina mescola giocate molto probabili (70%+) con giocate medie (50-70%). Il rischio cresce con il numero di partite, non con selezioni a caso. Non sono consigli di gioco.</div>`;
const S=slips();
["l","m","h"].forEach(r=>{const g=S.map((s,i)=>[s,i]).filter(([s])=>s.r==r);if(!g.length)return;h+=`<div class="gh">${RN[r][1]} ${RN[r][0]}</div>`;
g.forEach(([s,i])=>{const{Q,P}=tot(s.L),ev=P*Q-1,o=openA[i];
h+=`<div class="card sc"><button class="sl" data-ao="${i}"><span class="rb ${RN[r][2]}"></span><span class="hl"><span class="ttl">${s.L.length} partite</span><span class="meta">Probabilità di riuscita ${(P*100).toFixed(P<.1?1:0).replace(".",",")}%</span><span class="bar"><i style="width:${Math.max(3,Math.round(P*100))}%"></i></span></span><span class="qv">${nm(Q)}</span><span class="chev">${o?"▴":"▾"}</span></button>`+(o?`<div class="ex">`+s.L.map(([id,k])=>{const m=DATA[id];return `<div class="xr ${tl(m.p[k])}"><span>${m.h} – ${m.a}${low(m)?" ⚠️":""}<br><span class="meta">${lab(m,k)}</span></span><span>${pc(m.p[k])} · ${nm(m.o[k])}</span></div>`}).join("")+`<div class="meta" style="margin:8px 0">Valore atteso per 1 €: <span class="${ev>=0?"pos":"neg"}">${ev>=0?"+":""}${nm(ev)} €</span></div><div class="row"><button class="go" data-ld="${i}">Carica nella schedina</button><button class="chip" data-pl="${i}">Segna come giocata</button></div></div>`:"")+`</div>`})});
const w=played.filter(p=>p.st==1).length,x=played.filter(p=>p.st==2).length;
h+=`<div class="gh">Giocate segnate</div><div class="card">`+(played.length?`<div class="meta">Vinte ${w} · Perse ${x} · In attesa ${played.length-w-x}. Tocca lo stato per cambiarlo.</div>`+played.map((p,i)=>`<div class="pk"><div class="x"><div><b>${p.d} · quota ${nm(p.Q)} · ${String(p.pp).replace(".",",")}%</b></div><div class="meta">${p.l}</div></div><button data-ps="${i}">${["In attesa","Vinta","Persa"][p.st]}</button><button data-pd="${i}" aria-label="Elimina">×</button></div>`).join(""):`<div class="meta">Ancora nessuna: usa “Segna come giocata” su una schedina.</div>`)+`</div>`;return h}
const KS=["1","X","2","o15","o25","u25","gg"];
const Phi=x=>{const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p};
const mw=(s,b)=>b==5?s*s*s*(1+3*(1-s)+6*(1-s)*(1-s)):s*s*(3-2*s);
const setp=(p,b)=>{let lo=0,hi=1;for(let i=0;i<40;i++){const m=(lo+hi)/2;mw(m,b)<p?lo=m:hi=m}return(lo+hi)/2};
const od=(p,g)=>Math.max(1.05,Math.round(100/(p*g))/100),f1=x=>String(x).replace(".",",");
// Tennis: dalla probabilità di vincere il match si ricava quella di vincere un singolo set (best of 3 o 5), poi la probabilità di vincere almeno un set
function TN(){return W.filter(w=>spOf(w[0])=="t").map(w=>{const b=w[6]||3,s=setp(w[4],b),sm=setp(w[5],b),at=q=>1-Math.pow(1-q,b==5?3:2);
const P=(a,q)=>({"1":a,"2":1-a,s1:at(q),s2:at(1-q)}),p=P(w[4],s),q=P(w[5],sm),o={};Object.keys(p).forEach(k=>o[k]=od(q[k],1.06));
return{lg:w[0],h:w[1],a:w[2],t:w[3],p,o,k:["1","2","s1","s2"],sp:"t",lb:{"1":w[1],"2":w[2],s1:w[1]+" ≥1 set",s2:w[2]+" ≥1 set"}}})}
// Basket: punti totali con distribuzione normale attorno alla media attesa; per ogni partita [linea, media modello, media mercato, deviazione]
function BK(){const X=[[224.5,227,225.5,18],[229.5,231,230,18],[232.5,233,235,18],[161.5,164,162,13]];
